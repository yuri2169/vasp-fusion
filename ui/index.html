    <title>VASP-FUSION · Wallet to exchange attribution</title>
    <meta name="description" content="Paste an unknown crypto wallet, learn which exchange took its deposits, with the evidence, and draft the request to that exchange." />
    <script>
      /* Runs before first paint so the theme is right on the first frame.
         Inline and tiny on purpose: a deferred module would be too late.
         ?theme=dark|light forces a theme for this page only (used for screenshots). */
      try {
        var q = new URLSearchParams(location.search).get('theme');
        var t = q || localStorage.getItem('vaspfusion.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* storage blocked: follow the device */ }
    </script>
