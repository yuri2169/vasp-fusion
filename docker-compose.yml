# VASP-FUSION offline demo: `make docker-up` (or `docker compose up`), then
# http://127.0.0.1:8000. Sign in with the demonstration account in demo/officer.json.
#
# Nothing here reaches the network: OFFLINE=1 makes the tool refuse any chain request
# that is not in the cache baked into the image.
name: vasp-fusion
services:
  vasp-fusion:
    image: vasp-fusion:offline
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        UI: ${UI:-none}            # UI=build compiles ui/ into the image
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"     # this machine only
    environment:
      OFFLINE: ${OFFLINE:-1}
      # auto: a login is required because the demo officer account exists. "off" removes it.
      VASPFUSION_AUTH: ${VASPFUSION_AUTH:-auto}
      # The audit log's key. Unset: a key file is made beside the log, inside the volume.
      # Set (32 characters or more), it stays out of the volume, which is stronger.
      VASPFUSION_AUDIT_KEY: ${VASPFUSION_AUDIT_KEY:-}
    volumes:
      # cases, requests, the audit log and the token secret outlive the container.
      # A rebuilt image does NOT replace what is already in this volume:
      # `docker compose down -v` starts again from the image's demo data.
      - vaspfusion-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  vaspfusion-data: {}
