      fiu_ind_registered: [lok-sabha-usq-966, lok-sabha-usq-112]

  - name: CoinSwitch
    aliases: [Coinswitch]
    legal_name: "Bitcipher Labs LLP"
    fiu_ind_registered: true
    fiu_ind_as_of: 2024-12-02
    cites:
      legal_name: [lok-sabha-usq-966, lok-sabha-usq-112]
      fiu_ind_registered: [lok-sabha-usq-966, lok-sabha-usq-112]

  - name: Bitbns
    legal_name: "Bitbns Internet Private Limited"
    fiu_ind_registered: true
    fiu_ind_as_of: 2024-12-02
    cites:
      legal_name: [lok-sabha-usq-966]
      fiu_ind_registered: [lok-sabha-usq-966]

  - name: Delta Exchange
    legal_name: "Excellium Technologies Pvt Ltd"
    fiu_ind_registered: true
    fiu_ind_as_of: 2024-12-02
    cites:
      legal_name: [lok-sabha-usq-966]
      fiu_ind_registered: [lok-sabha-usq-966]

  # ---------------------------------------------------------------- offshore
  - name: Binance
    # no single legal name: FIU-IND's list names one Binance company, its order three more
    fiu_ind_registered: true
    fiu_ind_as_of: 2024-12-02
    jurisdiction: "Cayman Islands"
    le_request_channel: "https://app.kodexglobal.com/binance/signup"
    notes:
      - text: "Binance announced its registration in its own statement of 15 Aug 2024; the official list of 2 Dec 2024 names Binance International Limited and does not state that company's country."
        cites: [binance-blog-india, lok-sabha-usq-966]
      - text: "The jurisdiction is that of Binance Holdings Limited, which the US Department of Justice (21 Nov 2023) calls the entity that operates Binance.com and which FIU-IND's order places in the Cayman Islands. It is not the company on FIU-IND's list."
        cites: [doj-binance, fiu-order-binance]
      - text: "FIU-IND's order of 19 Jun 2024 (penalty Rs 18.82 crore under section 13 PMLA) names Binance Investments Co., Ltd (Seychelles), Binance Holdings Limited (Cayman Islands) and Binance (Switzerland) AG."
        cites: [fiu-order-binance]
    cites:
      fiu_ind_registered: [lok-sabha-usq-966]
      jurisdiction: [doj-binance, fiu-order-binance]
      le_request_channel: [binance-le]

  - name: KuCoin
    legal_name: "Peken Global Limited"
    fiu_ind_registered: true
    fiu_ind_as_of: 2024-12-02
    jurisdiction: "Seychelles"
    le_request_channel: "https://www.kucoin.com/legal/requests"
    notes:
      - text: "KuCoin also states its registration itself (support page dated 16 Dec 2025)."
        cites: [kucoin-fiu]
      - text: "The US Attorney's Office, SDNY (27 Jan 2025) calls Peken Global Limited \"a Seychelles-based entity\" that has operated KuCoin since at least September 2019."
        cites: [doj-kucoin]
      - text: "FIU-IND's order of 22 Mar 2024 (penalty Rs 34.5 lakh under section 13 PMLA) is in the matter of Peken Global Limited (\"Kucoin\")."
        cites: [fiu-order-kucoin]
    cites:
      legal_name: [fiu-order-kucoin, lok-sabha-usq-966]
      fiu_ind_registered: [lok-sabha-usq-966]
      jurisdiction: [doj-kucoin]
      le_request_channel: [kucoin-le]

  - name: OKX
    # no legal_name: OKX asks to be addressed as "OKX" (its note below)
    jurisdiction: "Seychelles"
    le_request_channel: "https://app.kodexglobal.com/okx/signin"
    notes:
      - text: "The US Attorney's Office, SDNY (24 Feb 2025) calls Aux Cayes Fintech Co. Ltd, doing business as OKX, \"a Seychelles-based entity\" that has operated OKX since at least 2017."
        cites: [doj-okx]
      - text: "OKX asks that requests be addressed to \"OKX\" rather than to a specific legal entity; enforcement@okx.com is its channel for extraordinary circumstances."
        cites: [okx-le]
    cites:
      jurisdiction: [doj-okx]
      le_request_channel: [okx-le]

  - name: Bitget
    jurisdiction: "Singapore"
    le_request_channel: "https://app.kodexglobal.com/bitget/signup"
    notes:
      - text: "Japan's Financial Services Agency lists \"Bitget Limited\", the operator of Bitget, at Singapore (warned November 2024). That column is the location of the office or address: the list does not state where the company is incorporated, and no official source for that was found."
        cites: [jfsa-unregistered]
      - text: "A news report of 24 Jun 2025 (DeFi Planet, republished on bitget.com) says Bitget joined I4C's Sahyog portal. Not confirmed from an official source."
        cites: [bitget-sahyog-news]
    cites:
      jurisdiction: [jfsa-unregistered]
      le_request_channel: [bitget-le]

  - name: HTX
    aliases: [Huobi, "HTX (Huobi)"]
    # no legal_name: the FCA names one company and "persons unknown" (its note below)
    jurisdiction: "Panama"
    le_request_channel: "regulatory@htx-inc.com"
    notes:
      - text: "The UK Financial Conduct Authority's proceedings of 21 Oct 2025 over the HTX exchange name Huobi Global S.A., \"a company incorporated in Panama\", and also \"persons unknown\" who own or control the exchange: the FCA does not say the company is its only operator."
        cites: [fca-htx-proceedings]
      - text: "Named as Huobi (Sinohope Technology Holdings Ltd, Hong Kong; Huobi Global Limited, Singapore) in FIU-IND's show cause notices of 28 Dec 2023 for operating without complying with the PML Act. Its status since then was not found in a public source."
        cites: [pib-2023-12-28]
      - text: "HTX asks for requests in English, with wallet addresses and transaction hashes in a copyable format."
        cites: [htx-le]
    cites:
      jurisdiction: [fca-htx-proceedings]
      le_request_channel: [htx-le]

  - name: Gate.io
    aliases: [Gate]
    le_request_channel: "regulatory@gate.com"
    notes:
      - text: "Named (Gate Technology Incorporated, Cayman Islands) in FIU-IND's show cause notices of 28 Dec 2023 for operating without complying with the PML Act. Its status since then was not found in a public source."
        cites: [pib-2023-12-28]
      - text: "Gate asks that requests come in English from an official government email domain, with evidence of authority."
        cites: [gate-le]
    cites:
      le_request_channel: [gate-le]

  - name: Bitfinex
    legal_name: "iFinex Inc."
    jurisdiction: "British Virgin Islands"
    le_request_channel: "https://app.kodexglobal.com/bitfinex/signup"
    notes:
      - text: "Named (iFinex Inc and BFXWW Inc., British Virgin Islands) in FIU-IND's show cause notices of 28 Dec 2023 for operating without complying with the PML Act. Its status since then was not found in a public source."
        cites: [pib-2023-12-28]
      - text: "Bitfinex requires a freeze request to follow local legal process and to state the duration of the freeze."
        cites: [bitfinex-le]
    cites:
      legal_name: [bitfinex-le, pib-2023-12-28]
      jurisdiction: [pib-2023-12-28]
      le_request_channel: [bitfinex-le]

  - name: Bitrue
    legal_name: "Bitrue Ltd"
    fiu_ind_registered: false
    fiu_ind_as_of: 2025-10-01
    jurisdiction: "Singapore"
    cites:
      legal_name: [pib-2025-10-01]
      fiu_ind_registered: [pib-2025-10-01]
      jurisdiction: [pib-2025-10-01]

  - name: Bybit
    legal_name: "Bybit Fintech Limited"
    notes:
      - text: "FIU-IND's order of 31 Jan 2025 (penalty Rs 9.27 crore under section 13 PMLA) is in the matter of Bybit Fintech Limited. No source read states whether it is registered."
