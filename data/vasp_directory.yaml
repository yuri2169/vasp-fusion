# VASP directory: who to address a request to.
#
# RULE: only facts we can cite. Every non-empty fact field of an entry names, under
# `cites`, the source(s) it was read from; a field we could not cite stays out (blank).
# Every source below was opened and read on the `accessed` date. The loader
# (vaspfusion/desk/directory.py) refuses a fact without a source.
#
# Fact fields: legal_name, fiu_ind_registered (+ fiu_ind_as_of, which must be the date
# its source was published), jurisdiction, le_request_channel. Each note carries its own
# source. Every source has a kind: official (government or regulator), exchange (the
# exchange's own page) or news.
#
# What `fiu_ind_registered` means here:
#   true  = a source states the entity is registered with FIU-IND as a reporting entity
#   false = FIU-IND itself named the entity as operating without registering, on that date
#   blank = no source read, or the only source is a 2023 notice that is known to be out
#           of date (two of the nine exchanges it names have registered since)
# A registration is shown with its date and is a claim about that date only: the letter's
# review notes ask the officer to confirm it is current, and say when the only source is
# the exchange's own statement.
# FIU-IND does not publish a register on its website (checked 2 Oct 2026); the one
# official list of names is the annexure to a Lok Sabha answer of 4 Dec 2023.
# Registration is always shown with its date. It can have changed since.

sources:
