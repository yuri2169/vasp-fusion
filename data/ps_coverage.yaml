# Every line of problem statement 26182 (docs/problem_statement.md), word for word, with
# what the tool does about it. Read by vaspfusion/coverage.py and shown at /coverage.
#
# status: built | partly | planned. A row that is not `built` must say what is missing
# (`gap`). `where` is a screen of the interface; `evidence` is a test (a file, or
# file::function) or a `make` target that fails if the claim stops being true.
# tests/test_coverage.py holds every row to the PS text and every `built` row to its
# route and its evidence.
#
# A row with `computed: chains` gets its status and sentences from the chains the tool
# can trace today (TRACEABLE in vaspfusion/api/main.py), not from this file.

rows:
  # ---------------------------------------------------------------- Description
  - id: sahyog-intake
    section: The system should
    text: "Automatically analyze suspect cryptocurrency wallet addresses reported during investigations on the Sahyog Platform."
    status: partly
    what: "An intake API takes a complaint with its wallets, opens one case per wallet and traces each without anyone touching the tool; the result is handed back through the gateway."
    where: /sahyog-sim
    evidence: {test: "tests/api/test_sahyog_intake.py::test_a_complaint_is_traced_without_anyone_touching_the_tool"}
    gap: "SAHYOG's real interface is not public. This is our side of a contract, demonstrated with a simulator; nothing has been connected to the portal."

  - id: nearest-vasp-trace
    section: The system should
    text: "Automatically trace blockchain transaction paths to identify: nearest centralized exchange, custodial wallet service, or VASP receiving direct deposits from the suspect wallet."
    status: built
    what: "A wallet's money is followed hop by hop to the nearest labelled exchange, custodial wallet or swap service, in both directions. The exchange is named only when the label evidence holds; otherwise the case says the evidence is insufficient."
    where: /cases
    evidence: {test: "tests/test_demo_cases.py::test_each_demo_wallet_gives_the_expected_result"}

  - id: multi-chain-mapping
    section: The system should
    text: "Map blockchain of deposit addresses and transaction flows across multiple blockchain networks such as: Bitcoin, Ethereum, Tron, BNB Chain, Solana, Polygon, and other major chains."
    computed: chains
    named_chains: [bitcoin, ethereum, tron, bsc, solana, polygon]
    where: /cases/new
    evidence: {test: "tests/api/test_cases_live.py::test_addresses_we_cannot_trace_are_a_readable_422"}

  - id: entity-kinds
    section: The system should
    text: "Support identification of: exchange clusters, hot wallets, deposit wallets, mixers/tumblers, DeFi bridges, and cross-chain swap services."
    status: built
    what: "Labels carry the owner and the kind of wallet (hot, cold, deposit, reserve); Bitcoin addresses are clustered by co-spending; Tron deposit addresses are derived from sweeps and scored by a measured model; mixers, bridges and swap services are recognised from labels, and a CoinJoin from the shape of the transaction."
    where: /labels
    evidence: {test: "tests/test_cluster.py::test_an_address_spent_together_with_a_labelled_one_gets_that_owners_label"}

  - id: sahyog-apis
    section: The system should
    text: "Integrate Sahyog with blockchain intelligence APIs and graph analytics engines."
    status: partly
    what: "The tracing and attribution engine is behind a documented HTTP API with a contract for both directions: complaints in, results and requests out, replies in."
    where: /sahyog-sim
    evidence: {test: "tests/api/test_sahyog_intake.py::test_the_result_is_handed_to_the_gateway"}
    gap: "The contract is our proposal. The real portal has not been connected, because its interface is not public."

  - id: tagging-confidence
    section: The system should
    text: "Provide automated tagging and confidence scoring for suspected VASPs."
    status: built
    what: "Each named exchange carries a calibrated confidence with an interval, kept apart from how near it is; the measurements behind it are on the model page."
    where: /model
    evidence: {make: abstain-eval}

  - id: reports
    section: The system should
    text: "Generate investigation-ready reports for LEAs."
    status: built
    what: "Every finished case has an A4 case file (PDF): the result, where the funds went, the flow diagram, each exchange with its evidence and transaction hashes, the flags, the risk indicators, the limits, and a provenance receipt that can be verified."
    where: /cases
    evidence: {test: "tests/test_case_file.py::test_the_pdf_holds_the_findings_as_searchable_text"}

  - id: request-routing
    section: The system should
    text: "Assist investigators in automatically routing lawful disclosure or freezing requests to the correct VASP through the SAHYOG Portal."
    status: partly
    what: "Wallets are grouped under the exchange they route to; one request per exchange is drafted with its legal basis, approved by the officer, handed to the gateway, and the exchange's reply is tracked to 'freeze confirmed'."
    where: /desk
    evidence: {test: "tests/test_desk_service.py::test_sending_writes_the_payload_and_the_letter_to_the_outbox_once"}
    gap: "The gateway writes to a local outbox. Nothing is sent to the real portal or to an exchange."

  # ---------------------------------------------------------------- May additionally support
  - id: visualization
    section: The system may additionally support
    text: "visualization of fund movement"
    status: built
    what: "The Hop Rail, the fund-flow graph with a replay, the timeline and the 'where the funds went' bar on every case. The graph draws the wallet's own money only, and says so in the trace's own counts: how many transfers it saw, how many it followed, and why each other wallet was not followed. The rest of what it read can be switched on as greyed context, for one wallet or for all, without changing the answer. Many small payers of one wallet are drawn as one group that opens in place. An optional 3D view shows the same picture turned."
    where: /cases
    evidence: {test: "tests/test_case_trace_summary.py::test_the_counts_add_up_against_the_graph"}

  - id: cross-chain
    section: The system may additionally support
    text: "cross-chain transaction mapping"
    status: partly
    what: "A deposit into the Across bridge is matched to its payout by the bridge's own public index, the amount is read from the payout transaction on the destination chain, and the trace goes on from the recipient there with the same rules; the crossing counts as a hop and its cost as a fee. The recorded wallet is followed from Ethereum onto Base. A swap service on the path is named as a VASP and its request asks for the payout chain, address and transaction."
    where: /cases
    evidence: {test: "tests/test_demo_cases.py::test_eth_wallet_whose_money_went_into_a_bridge_is_followed_onto_base"}
    gap: "Only Across deposits are matched. Stargate / LayerZero, Wormhole, Hop and the rollups' own bridges are recognised and flagged, and the trail ends there with the transaction to follow by hand. A payout in another asset than the deposit (a stablecoin paid out as ETH) is named but not followed. A swap service's payout cannot be matched on-chain at all: it is asked for."

  - id: risk-scoring
    section: The system may additionally support
    text: "risk scoring"
    status: built
    what: "A score from 0 to 100 built from named red-flag indicators, each with its points and the transactions behind it. It is an indicator score, not a probability. Checked on 8 Oct 2026 on 65 wallets public sources list as illicit and 70 with a documented ordinary purpose, each with its own label hidden: 14 of 65 and 2 of 70 scored High or above, all 14 through a link to another listed address; none of the five pattern rules fired more often on the listed wallets. The points were not fitted to these wallets."
    where: /cases
    evidence: {make: risk-validation}

  - id: typologies
    section: The system may additionally support
    text: "identification of laundering typologies"
    status: built
    what: "Peel chains, fan-out, fan-in, forwarding within minutes, round amounts, bridge hops and CoinJoin shapes are flagged, each with the wallet, the figures and the transaction hashes. Checked on 8 Oct 2026 on 65 listed and 70 ordinary real wallets: each of the five pattern rules fired on ordinary wallets as often as on listed ones (peel chain 3 of 65 against 3 of 70, fan-out 8 against 15, fan-in 20 against 26, forwarding within minutes 13 against 21, round amounts 4 against 5), so a flag describes how money moved and is not by itself a sign of crime."
    where: /cases
    evidence: {test: "tests/test_typologies.py::test_wallets_that_each_peel_a_little_and_pass_the_rest_on_are_a_peel_chain"}

  - id: alerting
    section: The system may additionally support
    text: "alerting for high-risk wallets linked to ransomware, darknet, terrorism financing, or fraud ecosystems"
    status: built
    what: "Labels carry threat tags from cited public sources (the OFAC SDN list, Ransomwhere, GraphSense TagPacks, scam lists): ransomware, darknet market, terrorism financing, fraud. A case is screened when it is opened, a link to a tagged address is an alert that names the threat and the source, and a watched wallet raises a change on a new link or a higher risk class. A wallet none of those sources lists raises nothing: the alert is only as wide as the lists, and they are uneven by chain (the Tron tags are terrorism financing and sanctions only; the ransomware and darknet tags are Bitcoin; fraud is mostly Ethereum)."
    where: /watchlist
    evidence: {test: "tests/test_wallets_watch.py::test_a_recheck_that_finds_a_new_link_to_a_tagged_address_is_a_high_change"}

  # ---------------------------------------------------------------- Expected solution
  - id: automated-identification
    section: Expected solution
    text: "Automated identification of nearest VASP/exchange linked to unknown wallets."
    status: built
    what: "Paste a wallet and the nearest exchange comes back with its proximity and its confidence, or 'insufficient evidence' with what would change that."
    where: /cases/new
    evidence: {make: demo}

  - id: api-driven
    section: Expected solution
    text: "API-driven blockchain tracing and attribution support."
    status: built
    what: "Everything the interface does goes through the HTTP API (docs/api_contract.md, docs/openapi.json): open a case, read the result, the case file, the receipt."
    where: /cases/new
    evidence: {test: "tests/api/test_cases_live.py::test_post_runs_the_trace_and_get_returns_the_case"}

  - id: multi-chain-visualization
    section: Expected solution
    text: "Multi-chain transaction analysis and visualization."
    computed: chains
    named_chains: [bitcoin, ethereum, tron, bsc, solana, polygon]
    where: /cases
    evidence: {test: "tests/api/test_cases_live.py::test_a_bitcoin_wallet_is_traced_and_named_by_the_cluster_of_the_address_it_paid"}

  - id: real-time
    section: Expected solution
    text: "Real-time generation of investigative intelligence."
    status: partly
    what: "A trace starts the moment a wallet is submitted and the case page shows what it has read so far. Measured on 5 Oct 2026: a complaint with the 12 recorded wallets, on six chains, went from intake to 12 results in 6.3 seconds (four runs, all between 6.3 and 6.4; artifacts/intake_timing.json)."
    where: /cases/new
    evidence: {test: "tests/api/test_cases_live.py::test_a_running_case_says_what_the_trace_has_read_so_far"}
    gap: "That figure replays recorded chain responses with no network. A live trace also waits on the public chain APIs and their rate limits, which was not timed. Nothing watches a chain continuously: a watched wallet is checked when the officer asks."

  - id: risk-classification
    section: Expected solution
    text: "Risk classification of wallets and transaction flows."
    status: built
    what: "Every wallet and every case has a class (Low, Medium, High, Severe) with its reasons, and every traced transfer is classified by the indicators on it."
    where: /cases
    evidence: {test: "tests/test_risk.py::test_the_ofac_case_is_severe_and_a_clean_attributed_case_is_not"}

  - id: dashboard
    section: Expected solution
    text: "Dashboard for LEAs with case-based analytics and reporting."
    status: built
    what: "Counts of cases by outcome, by chain and by risk class, the exchanges reached, requests awaiting reply and recent alerts, each counted from stored records and linked to the list behind it."
    where: /dashboard
    evidence: {test: "tests/test_dashboard.py::test_outcomes_count_every_finished_case_once"}

  - id: scale
    section: Expected solution
    text: "Scalable architecture capable of handling large-volume blockchain transaction analysis."
    status: partly
    what: "A batch of up to 2,000 wallets is uploaded, queued in a table that survives a restart, and traced by a pool of worker processes that share one response cache and one rate limit per provider. The officer can raise a trace's budget from 40 to 2,000 wallets. Measured on one machine: 410 cases a minute with one worker, 901 with four (artifacts/scale/metrics.json)."
    where: /batch
    evidence: {make: bench-scale}
    gap: "Measured on one laptop with chain responses replayed from a cache: live throughput, which the providers' rate limits bound, was not measured. More than four workers gave no gain there. The case store is a single file with one writing process, and nothing was run on more than one machine (docs/scaling.md)."

  # ---------------------------------------------------------------- The solution should aim to
  - id: aim-time
    section: The solution should aim to
    text: "reduce investigation time"
    status: partly
    what: "A wallet is traced, attributed and written up as a case file and a draft request without manual chain analysis."
    where: /cases
    evidence: {make: intake-timing}
    gap: "The time the tool takes is measured. The time the same work takes by hand has not been measured, so no saving is claimed."

  - id: aim-freezing
    section: The solution should aim to
    text: "improve asset freezing efficiency"
    status: partly
    what: "A freeze can be asked for in the request (section 106 BNSS is added to the legal basis) and the request is tracked until the exchange confirms the freeze."
    where: /desk
    evidence: {test: "tests/test_desk_service.py::test_the_legal_basis_names_the_notice_the_certificate_and_the_freeze_power"}
    gap: "No request has gone to a real exchange, so no freeze has been made or timed."

  - id: aim-attribution
    section: The solution should aim to
    text: "enhance attribution capabilities"
    status: built
    what: "Attribution is measured, not asserted, on six chains beside a naive baseline: 761 real wallets that paid a labelled exchange were traced with the labels one hop away hidden (Tron 280, Ethereum 213, Bitcoin 96, BNB Chain 84, Polygon 74, Solana 14). The share named wrongly is on the model page for each chain (Tron 15 of 155, Ethereum 22 of 69, Bitcoin 2 of 28, BNB Chain 0 of 19, Polygon 0 of 11, Solana 0 of 3), with the deposit-address model's calibration error and coverage."
    where: /model
    evidence: {make: reproduce}

  - id: aim-cross-border
    section: The solution should aim to
    text: "strengthen cross-border cybercrime investigations involving VDAs"
    status: partly
    what: "Foreign exchanges are named and requests are routed to them with their legal name, jurisdiction and law-enforcement channel where a source for these was found."
    where: /desk
    evidence: {test: "tests/test_desk_directory.py"}
    gap: "The jurisdiction map is not built: no cited jurisdiction was found for the exchanges the recorded cases reach."
