# VDA service providers registered with FIU-IND, exactly as the official list names them.
#
# RULE: this file copies one source and adds nothing to it. `legal_name` and `trade_name`
# are the list's "RE Name" and "Trade Name" columns, in the list's order (`n` is its
# serial number); a "-" in the list is a blank trade name here. The list does not say which
# providers are exchanges, where a company is incorporated, or whether a registration is
# still current: neither does this file.
#
# `names` is ours: the name(s) the label store files that provider's wallets under, used
# only to count the labels we hold (vaspfusion/labels/india.py). Left out, it is the trade
# name. An empty list means "never match by name" (a trade name another company shares).
#
# FIU-IND publishes no register on its website (checked 2 Oct and 8 Oct 2026). This
# annexure is the newest official list of names found; an older one (Lok Sabha Unstarred
# Question 112, 4 Dec 2023) has 28 of these entities.

source:
  title: "Lok Sabha Unstarred Question No. 966, answered 2 Dec 2024, Annexure-A: Details of 47 Virtual Digital Asset Service Providers (VDA SPs) Registered with Financial Intelligence Unit-India (FIU-IND)"
  publisher: "Ministry of Finance, Department of Revenue (Lok Sabha)"
  url: "https://sansad.in/getFile/loksabhaquestions/annex/183/AU966_nhWk4P.pdf?source=pqals"
  licence: "Government of India parliamentary record (public)"
  published: 2024-12-02
  accessed: 2026-10-08

