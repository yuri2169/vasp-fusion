[project]
name = "vasp-fusion"
version = "0.1.0"
description = "Nearest-VASP attribution for unknown crypto wallets, with calibrated confidence (SIH 2026 PS 26182)"
requires-python = ">=3.12"
dependencies = [
  "fastapi", "uvicorn[standard]", "pydantic>=2", "python-multipart",
  "numpy", "scipy", "scikit-learn", "polars", "pyarrow",
  "lightgbm", "shap", "duckdb", "python-igraph",
  "pyyaml", "jinja2", "reportlab>=5,<6",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vaspfusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
